<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0f1115">
  <title>Paris Dakar Controle</title>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">

  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icone.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <!-- tema aplicado antes da primeira pintura: evita flash branco no dark mode -->
  <script src="/src/tema.js"></script>
</head>
<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>

  <header class="topo" id="topo" hidden>
    <button class="menu-btn" id="btn-menu" aria-label="Abrir menu" aria-expanded="false">☰</button>
    <strong class="marca">Paris Dakar <span>Controle</span></strong>
    <span class="conexao" id="indicador-conexao" role="status" aria-live="polite">online</span>
    <button class="icone" id="btn-tema" aria-label="Alternar tema claro e escuro">◐</button>
    <button class="icone" id="btn-sair" aria-label="Sair da conta">⏻</button>
  </header>

  <div id="menu-backdrop" class="menu-backdrop" hidden></div>

  <nav class="lateral" id="nav" hidden aria-label="Navegação principal">
    <a href="#/painel" data-rota="painel">Painel</a>
    <a href="#/movimentacoes" data-rota="movimentacoes">Movimentações</a>
    <a href="#/veiculos" data-rota="veiculos">Veículos</a>
    <a href="#/cadastros" data-rota="cadastros" data-master>Portarias e destinos</a>
    <a href="#/importar" data-rota="importar" data-master>Importar planilha</a>
    <a href="#/usuarios" data-rota="usuarios" data-master>Usuários</a>
  </nav>

  <main id="conteudo" class="conteudo" tabindex="-1"></main>

  <div id="avisos" class="avisos" role="status" aria-live="polite"></div>

  <script type="module" src="/src/app.js"></script>
</body>
</html>
